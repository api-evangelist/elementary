aid: elementary
name: Elementary
description: 'Elementary is an AI-powered machine-vision inspection company for manufacturing,
  founded in 2017 in South Pasadena, California (originally Elementary Robotics). Its
  VisionStream self-training edge AI detects production defects in seconds without
  rules, labeling, or tuning, while the QualityOS cloud platform delivers traceability,
  analytics, and MES/ERP integration across production lines. Elementary inspects over
  one billion parts annually for Fortune 500 manufacturers across food & beverage,
  automotive, consumer packaged goods, electronics, and life sciences, and is backed
  by Rockwell Automation, Tiger Global, Toyota Ventures, Threshold Ventures, Fika Ventures,
  and Idealab. The company exposes no public developer API; this profile captures its
  identity, security posture, and public web properties.'
